<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Télécommande IR HC-05</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #121212; color: #fff; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    header { text-align: center; margin-bottom: 24px; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
    p.subtitle { font-size: 0.875rem; color: #aaa; }
    .status-card { background: #1e1e1e; padding: 12px 20px; border-radius: 12px; display: flex; align-items: center; gap: 12px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: #ef4444; transition: background-color 0.3s; }
    .status-dot.connected { background-color: #22c55e; }
    .btn-connect { background: linear-gradient(135deg, #0284c7, #2563eb); color: white; border: none; padding: 12px 24px; font-size: 0.95rem; font-weight: 600; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; margin-bottom: 24px; }
    .btn-connect:hover { transform: translateY(-1px); }
    .remote { background: #1e1e1e; padding: 24px; border-radius: 24px; display: grid; grid-template-columns: repeat(4, 64px); gap: 14px; border: 1px solid rgba(255,255,255,0.08); }
    button.ir-btn { width: 64px; height: 52px; border: none; border-radius: 12px; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; transition: all 0.15s ease; }
    button.ir-btn:active { transform: scale(0.92); }
    .btn-up, .btn-down { background-color: #475569; }
    .btn-off { background-color: #334155; }
    .btn-power { background-color: #dc2626; }
    .btn-r { background-color: #ef4444; }
    .btn-g { background-color: #22c55e; }
    .btn-b { background-color: #3b82f6; }
    .btn-w { background-color: #f8fafc; color: #0f172a; }
    .btn-r1 { background-color: #f97316; }
    .btn-r2 { background-color: #fb923c; }
    .btn-r3 { background-color: #fba556; }
    .btn-r4 { background-color: #facc15; color: #0f172a; }
    .btn-g1 { background-color: #10b981; }
    .btn-g2 { background-color: #14b8a6; }
    .btn-g3 { background-color: #06b6d4; }
    .btn-g4 { background-color: #0891b2; }
    .btn-b1 { background-color: #6366f1; }
    .btn-b2 { background-color: #8b5cf6; }
    .btn-b3 { background-color: #a855f7; }
    .btn-b4 { background-color: #d946ef; }
    .btn-effect { background-color: #64748b; font-size: 0.7rem; }
  </style>
</head>
<body>

  <header>
    <h1>Télécommande LED IR</h1>
    <p class="subtitle">Contrôle HC-05 via Web Serial</p>
  </header>

  <div class="status-card">
    <div id="statusDot" class="status-dot"></div>
    <span id="statusText" style="font-size: 0.875rem;">Déconnecté</span>
  </div>

  <button class="btn-connect" onclick="connectSerial()">Connexion Bluetooth (Série)</button>

  <div class="remote">
    <button class="ir-btn btn-up" onclick="sendCmd('UP')">☀️ +</button>
    <button class="ir-btn btn-down" onclick="sendCmd('DOWN')">☀️ -</button>
    <button class="ir-btn btn-off" onclick="sendCmd('OFF')">OFF</button>
    <button class="ir-btn btn-power" onclick="sendCmd('POWER')">ON</button>

    <button class="ir-btn btn-r" onclick="sendCmd('R')">R</button>
    <button class="ir-btn btn-g" onclick="sendCmd('G')">G</button>
    <button class="ir-btn btn-b" onclick="sendCmd('B')">B</button>
    <button class="ir-btn btn-w" onclick="sendCmd('WHITE')">W</button>

    <button class="ir-btn btn-r1" onclick="sendCmd('R1')"></button>
    <button class="ir-btn btn-g1" onclick="sendCmd('G1')"></button>
    <button class="ir-btn btn-b1" onclick="sendCmd('B1')"></button>
    <button class="ir-btn btn-effect" onclick="sendCmd('FLASH')">FLASH</button>

    <button class="ir-btn btn-r2" onclick="sendCmd('R2')"></button>
    <button class="ir-btn btn-g2" onclick="sendCmd('G2')"></button>
    <button class="ir-btn btn-b2" onclick="sendCmd('B2')"></button>
    <button class="ir-btn btn-effect" onclick="sendCmd('STROBE')">STROBE</button>

    <button class="ir-btn btn-r3" onclick="sendCmd('R3')"></button>
    <button class="ir-btn btn-g3" onclick="sendCmd('G3')"></button>
    <button class="ir-btn btn-b3" onclick="sendCmd('B3')"></button>
    <button class="ir-btn btn-effect" onclick="sendCmd('SMOOTH')">SMOOTH</button>

    <button class="ir-btn btn-r4" onclick="sendCmd('R4')"></button>
    <button class="ir-btn btn-g4" onclick="sendCmd('G4')"></button>
    <button class="ir-btn btn-b4" onclick="sendCmd('B4')"></button>
    <button class="ir-btn btn-effect" onclick="sendCmd('MODE')">MODE</button>
  </div>

  <script>
    let port;
    let writer;

    async function connectSerial() {
      if (!("serial" in navigator)) {
        alert("Web Serial n'est pas supporté sur ce navigateur. Utilise Chrome ou Edge sur PC.");
        return;
      }
      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        const textEncoder = new TextEncoderStream();
        textEncoder.readable.pipeTo(port.writable);
        writer = textEncoder.writable.getWriter();

        document.getElementById('statusDot').classList.add('connected');
        document.getElementById('statusText').innerText = "Connecté au HC-05";
      } catch (err) {
        console.error("Erreur Série :", err);
      }
    }

    async function sendCmd(cmd) {
      if (!writer) {
        alert("Connecte d'abord le Bluetooth !");
        return;
      }
      await writer.write(cmd + "\n");
    }
  </script>
</body>
</html>
