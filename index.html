<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Télécommande IR Osram</title>
  <style>
    body { font-family: sans-serif; background: #121214; color: #fff; text-align: center; padding: 20px; }
    .btn-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    button { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .conn-btn { background: #2563eb; color: white; }
    .conn-btn.bt { background: #7c3aed; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 320px; margin: 0 auto; background: #1e1e24; padding: 15px; border-radius: 12px; }
    .ir-btn { height: 45px; border-radius: 6px; color: white; text-shadow: 0 1px 2px #000; font-size: 12px; }
  </style>
</head>
<body>

  <h2>Télécommande IR Osram</h2>
  <div class="btn-group">
    <button class="conn-btn" onclick="connectSerial()">USB (Câble)</button>
    <button class="conn-btn bt" onclick="connectSerial()">Bluetooth (HC-05)</button>
  </div>
  <p id="status" style="color: #ef4444;">Déconnecté</p>
  <p style="font-size: 11px; color: #888; max-width: 320px; margin: 0 auto 20px;">
    Les deux boutons ouvrent la même fenêtre de sélection : choisis le port COM du câble USB, ou celui du HC-05 (une fois appairé dans les paramètres Bluetooth de Windows).
  </p>

  <div class="grid">
    <!-- Ligne 1 -->
    <button class="ir-btn" style="background:#4b5563" onclick="send('UP')">☀️ +</button>
    <button class="ir-btn" style="background:#4b5563" onclick="send('DOWN')">☀️ -</button>
    <button class="ir-btn" style="background:#1f2937" onclick="send('OFF')">OFF</button>
    <button class="ir-btn" style="background:#dc2626" onclick="send('POWER')">ON</button>

    <!-- Ligne 2 -->
    <button class="ir-btn" style="background:#ef4444" onclick="send('R')">R</button>
    <button class="ir-btn" style="background:#22c55e" onclick="send('G')">G</button>
    <button class="ir-btn" style="background:#3b82f6" onclick="send('B')">B</button>
    <button class="ir-btn" style="background:#f8fafc; color:#000" onclick="send('WHITE')">W</button>

    <!-- Ligne 3 -->
    <button class="ir-btn" style="background:#f97316" onclick="send('R1')">R1</button>
    <button class="ir-btn" style="background:#10b981" onclick="send('G1')">G1</button>
    <button class="ir-btn" style="background:#6366f1" onclick="send('B1')">B1</button>
    <button class="ir-btn" style="background:#374151" onclick="send('FLASH')">FLASH</button>

    <!-- Ligne 4 -->
    <button class="ir-btn" style="background:#fb923c" onclick="send('R2')">R2</button>
    <button class="ir-btn" style="background:#14b8a6" onclick="send('G2')">G2</button>
    <button class="ir-btn" style="background:#8b5cf6" onclick="send('B2')">B2</button>
    <button class="ir-btn" style="background:#374151" onclick="send('STROBE')">STROBE</button>

    <!-- Ligne 5 -->
    <button class="ir-btn" style="background:#fdba74" onclick="send('R3')">R3</button>
    <button class="ir-btn" style="background:#06b6d4" onclick="send('G3')">G3</button>
    <button class="ir-btn" style="background:#a855f7" onclick="send('B3')">B3</button>
    <button class="ir-btn" style="background:#374151" onclick="send('SMOOTH')">SMOOTH</button>

    <!-- Ligne 6 -->
    <button class="ir-btn" style="background:#facc15; color:#000" onclick="send('R4')">R4</button>
    <button class="ir-btn" style="background:#0284c7" onclick="send('G4')">G4</button>
    <button class="ir-btn" style="background:#d946ef" onclick="send('B4')">B4</button>
    <button class="ir-btn" style="background:#374151" onclick="send('MODE')">MODE</button>
  </div>

  <script>
    let port, writer;

    async function connectSerial() {
      if (!("serial" in navigator)) {
        alert("Web Serial non supporté. Utilise Chrome ou Edge sur PC.");
        return;
      }
      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        writer = port.writable.getWriter();
        document.getElementById('status').innerText = 'Connecté';
        document.getElementById('status').style.color = '#22c55e';
      } catch (e) {
        console.error(e);
        alert('Erreur de connexion : ' + e);
      }
    }

    async function send(cmd) {
      if (!writer) {
        alert('Connecte la carte d\'abord (USB ou Bluetooth) !');
        return;
      }
      const data = new TextEncoder().encode(cmd + '\n');
      await writer.write(data);
    }
  </script>
</body>
</html>
