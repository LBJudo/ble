<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Télécommande IR Osram</title>
  <style>
    body { font-family: sans-serif; background: #121214; color: #fff; text-align: center; padding: 20px; }
    .btn-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    button { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .conn-btn { background: #2563eb; color: white; }
    .conn-btn.bt { background: #7c3aed; }
    .disc-btn { background: #ef4444; color: white; display: none; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 320px; margin: 0 auto; background: #1e1e24; padding: 15px; border-radius: 12px; }
    .ir-btn { height: 45px; border-radius: 6px; color: white; text-shadow: 0 1px 2px #000; font-size: 12px; }
  </style>
</head>
<body>

  <h2>Télécommande IR Osram</h2>
  <div class="btn-group">
    <button class="conn-btn" onclick="connectSerial()">USB (Port COM)</button>
    <button class="conn-btn bt" onclick="connectBluetooth()">Bluetooth Web</button>
    <button id="disconnectBtn" class="disc-btn" onclick="disconnect()">Déconnecter</button>
  </div>
  <p id="status" style="color: #ef4444;">Déconnecté</p>
  <p style="font-size: 11px; color: #888; max-width: 320px; margin: 0 auto 20px;">
    <strong>USB / Serial :</strong> Sélectionne le port COM (Câble USB ou HC-05 appairé sous Windows).<br>
    <strong>Bluetooth Web :</strong> Connexion directe sans appairage préalable (Chrome Android / PC).
  </p>

  <div class="grid">
    <!-- Ligne 1 -->
    <button class="ir-btn" style="background:#4b5563" onclick="send('UP')">☀️ +</button>
    <button class="ir-btn" style="background:#4b5563" onclick="send('DOWN')">☀️ -</button>
    <button class="ir-btn" style="background:#1f2937" onclick="send('OFF')">OFF</button>
    <button class="ir-btn" style="background:#dc2626" onclick="send('POWER')">ON</button>

    <!-- Ligne 2 -->
    <button class="ir-btn" style="background:#ef4444" onclick="send('R')">R</button>
    <button class="ir-btn" style="background:#22c55e" onclick="send('G')">G</button>
    <button class="ir-btn" style="background:#3b82f6" onclick="send('B')">B</button>
    <button class="ir-btn" style="background:#f8fafc; color:#000" onclick="send('WHITE')">W</button>

    <!-- Ligne 3 -->
    <button class="ir-btn" style="background:#f97316" onclick="send('R1')">R1</button>
    <button class="ir-btn" style="background:#10b981" onclick="send('G1')">G1</button>
    <button class="ir-btn" style="background:#6366f1" onclick="send('B1')">B1</button>
    <button class="ir-btn" style="background:#374151" onclick="send('FLASH')">FLASH</button>

    <!-- Ligne 4 -->
    <button class="ir-btn" style="background:#fb923c" onclick="send('R2')">R2</button>
    <button class="ir-btn" style="background:#14b8a6" onclick="send('G2')">G2</button>
    <button class="ir-btn" style="background:#8b5cf6" onclick="send('B2')">B2</button>
    <button class="ir-btn" style="background:#374151" onclick="send('STROBE')">STROBE</button>

    <!-- Ligne 5 -->
    <button class="ir-btn" style="background:#fdba74" onclick="send('R3')">R3</button>
    <button class="ir-btn" style="background:#06b6d4" onclick="send('G3')">G3</button>
    <button class="ir-btn" style="background:#a855f7" onclick="send('B3')">B3</button>
    <button class="ir-btn" style="background:#374151" onclick="send('SMOOTH')">SMOOTH</button>

    <!-- Ligne 6 -->
    <button class="ir-btn" style="background:#facc15; color:#000" onclick="send('R4')">R4</button>
    <button class="ir-btn" style="background:#0284c7" onclick="send('G4')">G4</button>
    <button class="ir-btn" style="background:#d946ef" onclick="send('B4')">B4</button>
    <button class="ir-btn" style="background:#374151" onclick="send('MODE')">MODE</button>
  </div>

  <script>
    let connectionType = null; // 'serial' ou 'bluetooth'
    let serialPort, serialWriter;
    let btDevice, btCharacteristic;

    // --- Connexion Serial (USB / Port COM Bluetooth) ---
    async function connectSerial() {
      if (!("serial" in navigator)) {
        alert("Web Serial non supporté. Utilise Chrome ou Edge.");
        return;
      }
      try {
        await disconnect();
        serialPort = await navigator.serial.requestPort();
        await serialPort.open({ baudRate: 9600 });
        serialWriter = serialPort.writable.getWriter();
        connectionType = 'serial';
        updateStatus(true, 'USB / Serial');
      } catch (e) {
        console.error(e);
        alert('Erreur de connexion Serial : ' + e);
      }
    }

    // --- Connexion Bluetooth Web Directe ---
    async function connectBluetooth() {
      if (!("bluetooth" in navigator)) {
        alert("Web Bluetooth non supporté. Utilise Chrome (sur Android/PC).");
        return;
      }
      try {
        await disconnect();
        // Recherche des périphériques exposant un service UART Serie (ex: HC-05, HM-10, ESP32)
        btDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            '00001101-0000-1000-8000-00805f9b34fb', // SPP Standard (HC-05/HC-06)
            '6e400001-b5a3-f393-e0a9-e50e24dcca9e'  # Nordic UART Service (BLE/ESP32)
          ]
        });

        btDevice.addEventListener('gattserverdisconnected', onDisconnected);
        const server = await btDevice.gatt.connect();

        // Récupération du service et de la caractéristique d'écriture
        const services = await server.getPrimaryServices();
        if (services.length === 0) throw new Error("Aucun service Bluetooth disponible.");

        const characteristics = await services[0].getCharacteristics();
        // Recherche d'une caractéristique acceptant l'écriture
        btCharacteristic = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);

        if (!btCharacteristic) throw new Error("Aucune caractéristique d'écriture trouvée.");

        connectionType = 'bluetooth';
        updateStatus(true, `Bluetooth (${btDevice.name || 'Appareil'})`);
      } catch (e) {
        console.error(e);
        alert('Erreur de connexion Bluetooth : ' + e);
      }
    }

    // --- Envoi de commande ---
    async function send(cmd) {
      const payload = new TextEncoder().encode(cmd + '\n');

      try {
        if (connectionType === 'serial' && serialWriter) {
          await serialWriter.write(payload);
        } else if (connectionType === 'bluetooth' && btCharacteristic) {
          await btCharacteristic.writeValue(payload);
        } else {
          alert('Connecte un appareil d\'abord !');
        }
      } catch (e) {
        console.error("Erreur d'envoi :", e);
        alert("Échec de l'envoi de la commande.");
      }
    }

    // --- Déconnexion ---
    async function disconnect() {
      if (serialWriter) {
        await serialWriter.releaseLock();
        serialWriter = null;
      }
      if (serialPort) {
        await serialPort.close();
        serialPort = null;
      }
      if (btDevice && btDevice.gatt.connected) {
        btDevice.gatt.disconnect();
      }
      onDisconnected();
    }

    function onDisconnected() {
      connectionType = null;
      btDevice = null;
      btCharacteristic = null;
      updateStatus(false);
    }

    function updateStatus(isConnected, name = '') {
      const statusEl = document.getElementById('status');
      const discBtn = document.getElementById('disconnectBtn');

      if (isConnected) {
        statusEl.innerText = `Connecté : ${name}`;
        statusEl.style.color = '#22c55e';
        discBtn.style.display = 'inline-block';
      } else {
        statusEl.innerText = 'Déconnecté';
        statusEl.style.color = '#ef4444';
        discBtn.style.display = 'none';
      }
    }
  </script>
</body>
</html>
